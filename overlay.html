<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GGU GPS OBS Overlay</title>
    <meta name="description" content="OBS Studio Live GPS Transparent Browser Source Overlay powered by Firebase." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background-color: transparent !important;
        color: #111111;
        font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }

      #root {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        padding: 32px 24px;
      }

      .container {
        width: 100%;
        max-width: 720px;
        display: flex;
        flex-direction: column;
        align-items: center;
        text-align: center;
        animation: fadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1);
      }

      .logo {
        font-size: 56px;
        font-weight: 900;
        line-height: 1.1;
        letter-spacing: -0.02em;
        background: linear-gradient(135deg, #0F4CFF 0%, #D40000 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 36px;
      }

      .content-list {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        gap: 28px;
      }

      .info-item {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
      }

      .label {
        font-size: 22px;
        font-weight: 700;
        line-height: 1.4;
        color: #111111;
        margin-bottom: 4px;
      }

      .value {
        font-size: 22px;
        font-weight: 400;
        line-height: 1.5;
        color: #111111;
        text-align: center;
        max-width: 640px;
      }

      .status-message {
        font-size: 24px;
        font-weight: 700;
        line-height: 1.5;
        color: #111111;
        text-align: center;
        margin-top: 12px;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(8px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div className="container">
        <h1 class="logo">GGU</h1>

        <div id="status-message" class="status-message">Waiting for GPS...</div>

        <div id="content-list" class="content-list" style="display: none;">
          <div class="info-item">
            <div class="label">Place :</div>
            <div id="address-val" class="value">--</div>
          </div>

          <div class="info-item">
            <div class="label">Latitude :</div>
            <div id="lat-val" class="value">--</div>
          </div>

          <div class="info-item">
            <div class="label">Longitude :</div>
            <div id="lon-val" class="value">--</div>
          </div>

          <div class="info-item">
            <div class="label">Time :</div>
            <div id="time-val" class="value">--</div>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="./overlay.js"></script>
  </body>
</html>

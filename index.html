<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GGU GPS Tracker</title>
    <meta name="description" content="Live GPS tracking — real-time latitude, longitude, and time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        color: #111111;
        font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* 2-column layout with vertical divider */
      .grid-wrapper {
        display: flex;
        align-items: stretch;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .col-left  { align-items: flex-end;   padding-right: 18px; }
      .col-right { align-items: flex-start; padding-left: 18px; border-left: 1.5px solid #e0e0e0; }

      /* Each cell */
      .cell { display: flex; flex-direction: column; gap: 2px; }

      .label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #111111;
      }

      .value {
        font-size: 24px;
        font-weight: 700;
        color: #111111;
        line-height: 1.2;
        transition: color 0.15s ease;
      }

      /* Flash green briefly when values update */
      .value.updated {
        color: #007A3D;
      }

      .status-message {
        font-size: 20px;
        font-weight: 400;
        color: #111111;
        text-align: center;
        line-height: 1.6;
      }

      /* Source Indicator */
      .source-badge {
        margin-top: 18px;
        font-size: 11px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #111111;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .source-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background-color: #00C853;
      }

      .source-dot.gps {
        animation: pulse-dot 1.6s infinite cubic-bezier(0.66, 0, 0, 1);
      }

      @keyframes pulse-dot {
        0%   { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0,200,83,0.7); }
        70%  { transform: scale(1.05); box-shadow: 0 0 0 6px rgba(0,200,83,0); }
        100% { transform: scale(0.9); box-shadow: 0 0 0 0 rgba(0,200,83,0); }
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const getTime = (d) => d.toLocaleString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true,
      });

      const getDate = (d) => d.toLocaleDateString('en-US', {
        month: 'numeric', day: 'numeric', year: 'numeric',
      });

      function flashElement(ref) {
        if (!ref.current) return;
        ref.current.classList.add('updated');
        setTimeout(() => ref.current && ref.current.classList.remove('updated'), 300);
      }

      function App() {
        const [lat, setLat] = useState(null);
        const [lon, setLon] = useState(null);
        const [time, setTime] = useState(() => getTime(new Date()));
        const [date, setDate] = useState(() => getDate(new Date()));
        const [isLiveGPS, setIsLiveGPS] = useState(false);
        const [loading, setLoading] = useState(true);

        const latRef = useRef(null);
        const lonRef = useRef(null);
        const prevCoords = useRef({ lat: null, lon: null });

        // 1-second clock update
        useEffect(() => {
          const t = setInterval(() => {
            const now = new Date();
            setTime(getTime(now));
            setDate(getDate(now));
          }, 1000);
          return () => clearInterval(t);
        }, []);

        useEffect(() => {
          let isMounted = true;

          // 1. Instant IP Location Fetch (No permission modal required!)
          const fetchIPLocation = async () => {
            try {
              const res = await fetch('https://freeipapi.com/api/json');
              const data = await res.json();
              if (isMounted && data && data.latitude && data.longitude) {
                if (prevCoords.current.lat === null) {
                  setLat(data.latitude);
                  setLon(data.longitude);
                  setLoading(false);
                }
              }
            } catch (e) {
              try {
                const res2 = await fetch('https://ipapi.co/json/');
                const data2 = await res2.json();
                if (isMounted && data2 && data2.latitude && data2.longitude) {
                  if (prevCoords.current.lat === null) {
                    setLat(data2.latitude);
                    setLon(data2.longitude);
                    setLoading(false);
                  }
                }
              } catch (err) {}
            }
          };

          fetchIPLocation();

          // 2. Real-Time Hardware GPS Stream (Updates dynamically as device moves when allowed)
          if (navigator.geolocation) {
            const updateGPSPosition = (position) => {
              if (!position || !position.coords) return;
              const newLat = position.coords.latitude;
              const newLon = position.coords.longitude;

              if (prevCoords.current.lat !== newLat || prevCoords.current.lon !== newLon) {
                prevCoords.current = { lat: newLat, lon: newLon };
                flashElement(latRef);
                flashElement(lonRef);
              }

              setLat(newLat);
              setLon(newLon);
              setIsLiveGPS(true);
              setLoading(false);
            };

            const options = {
              enableHighAccuracy: true,
              maximumAge: 0,
              timeout: 10000,
            };

            const watchId = navigator.geolocation.watchPosition(updateGPSPosition, () => {}, options);

            const pollId = setInterval(() => {
              navigator.geolocation.getCurrentPosition(updateGPSPosition, () => {}, options);
            }, 1000);

            return () => {
              isMounted = false;
              navigator.geolocation.clearWatch(watchId);
              clearInterval(pollId);
            };
          }

          return () => {
            isMounted = false;
          };
        }, []);

        if (loading || lat === null) return (
          <div className="container">
            <div className="status-message">Loading location...</div>
          </div>
        );

        return (
          <div className="container">
            <div className="grid-wrapper">
              {/* Left: Lat / Long */}
              <div className="col col-left">
                <div className="cell">
                  <div className="label">Latitude</div>
                  <div className="value" ref={latRef}>{Number(lat).toFixed(6)}</div>
                </div>
                <div className="cell">
                  <div className="label">Longitude</div>
                  <div className="value" ref={lonRef}>{Number(lon).toFixed(6)}</div>
                </div>
              </div>

              {/* Right: Time / Date */}
              <div className="col col-right">
                <div className="cell">
                  <div className="label">Time</div>
                  <div className="value">{time}</div>
                </div>
                <div className="cell">
                  <div className="label">Date</div>
                  <div className="value">{date}</div>
                </div>
              </div>
            </div>

            <div className="source-badge">
              <span className={`source-dot ${isLiveGPS ? 'gps' : ''}`}></span>
              {isLiveGPS ? 'LIVE HARDWARE GPS MOVEMENT ACTIVE' : 'NETWORK IP LOCATION (ALLOW PERMISSION FOR LIVE MOVEMENT)'}
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>

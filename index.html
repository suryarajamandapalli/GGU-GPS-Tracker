<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GGU GPS Tracker</title>
    <meta name="description" content="Live GPS tracking — real-time latitude, longitude, and time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        color: #111111;
        font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .container {
        animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* 2-column layout with vertical divider */
      .grid-wrapper {
        display: flex;
        align-items: stretch;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .col-left  { align-items: flex-end;   padding-right: 18px; }
      .col-right { align-items: flex-start; padding-left: 18px; border-left: 1.5px solid #e0e0e0; }

      /* Each cell */
      .cell { display: flex; flex-direction: column; gap: 2px; }

      .label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #111111;
      }

      .value {
        font-size: 24px;
        font-weight: 700;
        color: #111111;
        line-height: 1.2;
        transition: color 0.15s ease;
      }

      /* Flash green briefly when coordinates change */
      .value.updated {
        color: #007A3D;
      }

      .status-message {
        font-size: 20px;
        font-weight: 400;
        color: #111111;
        text-align: center;
        line-height: 1.6;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect, useRef } = React;

      const getTime = (d) => d.toLocaleString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true,
      });

      const getDate = (d) => d.toLocaleDateString('en-US', {
        month: 'numeric', day: 'numeric', year: 'numeric',
      });

      function flashElement(ref) {
        if (!ref.current) return;
        ref.current.classList.add('updated');
        setTimeout(() => ref.current && ref.current.classList.remove('updated'), 300);
      }

      function App() {
        const [lat,  setLat]   = useState(null);
        const [lon,  setLon]   = useState(null);
        const [time, setTime]  = useState(() => getTime(new Date()));
        const [date, setDate]  = useState(() => getDate(new Date()));
        const [permErr, setPermErr] = useState(false);
        const [loading, setLoading] = useState(true);

        const latRef = useRef(null);
        const lonRef = useRef(null);
        const prevCoords = useRef({ lat: null, lon: null });

        // 1-second clock
        useEffect(() => {
          const t = setInterval(() => {
            const now = new Date();
            setTime(getTime(now));
            setDate(getDate(now));
          }, 1000);
          return () => clearInterval(t);
        }, []);

        // Real-Time High-Frequency GPS Tracking System
        useEffect(() => {
          if (!navigator.geolocation) {
            setPermErr(true);
            setLoading(false);
            return;
          }

          const options = {
            enableHighAccuracy: true,
            maximumAge: 0,
            timeout: 10000,
          };

          const updatePosition = (position) => {
            if (!position || !position.coords) return;
            const newLat = position.coords.latitude;
            const newLon = position.coords.longitude;

            // Check if coordinates changed
            if (prevCoords.current.lat !== newLat || prevCoords.current.lon !== newLon) {
              prevCoords.current = { lat: newLat, lon: newLon };
              flashElement(latRef);
              flashElement(lonRef);
            }

            setLat(newLat);
            setLon(newLon);
            setLoading(false);
            setPermErr(false);
          };

          const handleError = (err) => {
            if (err.code === err.PERMISSION_DENIED) {
              setPermErr(true);
              setLoading(false);
            }
          };

          // 1. Continuous Watcher
          const watchId = navigator.geolocation.watchPosition(updatePosition, handleError, options);

          // 2. Active High-Frequency 1-Second Polling Fallback to force real-time location stream
          const pollInterval = setInterval(() => {
            navigator.geolocation.getCurrentPosition(updatePosition, handleError, options);
          }, 1000);

          return () => {
            navigator.geolocation.clearWatch(watchId);
            clearInterval(pollInterval);
          };
        }, []);

        if (permErr) return (
          <div className="container">
            <div className="status-message">
              Location permission denied.<br />
              Please enable location access to continue.
            </div>
          </div>
        );

        if (loading || lat === null) return (
          <div className="container">
            <div className="status-message">Waiting for GPS signal...</div>
          </div>
        );

        return (
          <div className="container">
            <div className="grid-wrapper">
              {/* Left: Lat / Long */}
              <div className="col col-left">
                <div className="cell">
                  <div className="label">Latitude</div>
                  <div className="value" ref={latRef}>{lat.toFixed(6)}</div>
                </div>
                <div className="cell">
                  <div className="label">Longitude</div>
                  <div className="value" ref={lonRef}>{lon.toFixed(6)}</div>
                </div>
              </div>

              {/* Right: Time / Date */}
              <div className="col col-right">
                <div className="cell">
                  <div className="label">Time</div>
                  <div className="value">{time}</div>
                </div>
                <div className="cell">
                  <div className="label">Date</div>
                  <div className="value">{date}</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>

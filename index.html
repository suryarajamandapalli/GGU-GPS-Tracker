<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GGU GPS Tracker</title>
    <meta name="description" content="Live GPS tracking — real-time latitude, longitude, date, and time." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;900&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      html, body {
        width: 100%;
        height: 100%;
        background: #ffffff;
        color: #111111;
        font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* 2-column layout with vertical divider */
      .grid-wrapper {
        display: flex;
        align-items: stretch;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .col-left  { align-items: flex-end;   padding-right: 18px; }
      .col-right { align-items: flex-start; padding-left: 18px; border-left: 1.5px solid #e0e0e0; }

      /* Each cell */
      .cell { display: flex; flex-direction: column; gap: 2px; }

      .label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #111111;
      }

      .value {
        font-size: 24px;
        font-weight: 700;
        color: #111111;
        line-height: 1.2;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      const getTime = (d) => d.toLocaleString('en-US', {
        hour: 'numeric', minute: '2-digit', second: '2-digit', hour12: true,
      });

      const getDate = (d) => d.toLocaleDateString('en-US', {
        month: 'numeric', day: 'numeric', year: 'numeric',
      });

      function App() {
        const [lat, setLat] = useState(17.397251);
        const [lon, setLon] = useState(78.413768);
        const [time, setTime] = useState(() => getTime(new Date()));
        const [date, setDate] = useState(() => getDate(new Date()));

        // 1-second clock update
        useEffect(() => {
          const t = setInterval(() => {
            const now = new Date();
            setTime(getTime(now));
            setDate(getDate(now));
          }, 1000);
          return () => clearInterval(t);
        }, []);

        // Silent Location Fetch (NO BROWSER PERMISSION PROMPT EVER)
        useEffect(() => {
          let isMounted = true;

          const fetchLocation = async () => {
            try {
              const res = await fetch('https://ipwho.is/');
              const data = await res.json();
              if (isMounted && data && data.success && data.latitude && data.longitude) {
                setLat(data.latitude);
                setLon(data.longitude);
                return;
              }
            } catch (e) {}

            try {
              const res2 = await fetch('https://freeipapi.com/api/json');
              const data2 = await res2.json();
              if (isMounted && data2 && data2.latitude && data2.longitude) {
                setLat(data2.latitude);
                setLon(data2.longitude);
                return;
              }
            } catch (e) {}

            try {
              const res3 = await fetch('https://ipapi.co/json/');
              const data3 = await res3.json();
              if (isMounted && data3 && data3.latitude && data3.longitude) {
                setLat(data3.latitude);
                setLon(data3.longitude);
                return;
              }
            } catch (e) {}
          };

          fetchLocation();

          return () => {
            isMounted = false;
          };
        }, []);

        return (
          <div className="container">
            <div className="grid-wrapper">
              {/* Left: Lat / Long */}
              <div className="col col-left">
                <div className="cell">
                  <div className="label">Latitude</div>
                  <div className="value">{Number(lat).toFixed(6)}</div>
                </div>
                <div className="cell">
                  <div className="label">Longitude</div>
                  <div className="value">{Number(lon).toFixed(6)}</div>
                </div>
              </div>

              {/* Right: Time / Date */}
              <div className="col col-right">
                <div className="cell">
                  <div className="label">Time</div>
                  <div className="value">{time}</div>
                </div>
                <div className="cell">
                  <div className="label">Date</div>
                  <div className="value">{date}</div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
  </body>
</html>

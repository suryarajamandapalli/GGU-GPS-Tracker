<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GGU GPS OBS Overlay</title>
    <meta name="description" content="Minimal OBS Studio Live GPS Overlay." />
    <!-- Google Font Figtree -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;700;900&display=swap" rel="stylesheet" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      html, body {
        width: 100%;
        height: 100%;
        background-color: transparent !important;
        color: #111111;
        font-family: 'Figtree', -apple-system, BlinkMacSystemFont, sans-serif;
        -webkit-font-smoothing: antialiased;
      }

      #root {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 24px;
      }

      .container {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: fadeIn 0.7s cubic-bezier(0.16, 1, 0.3, 1);
      }

      /* 2-column layout with vertical divider */
      .grid-wrapper {
        display: flex;
        align-items: stretch;
      }

      .col {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .col-left  { align-items: flex-end;   padding-right: 20px; }
      .col-right { align-items: flex-start; padding-left: 20px; border-left: 1.5px solid #e0e0e0; }

      /* Each cell */
      .cell { display: flex; flex-direction: column; gap: 2px; }

      .label {
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #111111;
      }

      .value {
        font-size: 24px;
        font-weight: 700;
        color: #111111;
        line-height: 1.2;
        transition: color 0.15s ease;
      }

      /* Flash green briefly when coordinates update */
      .value.updated {
        color: #007A3D;
      }

      .status-message {
        font-size: 20px;
        font-weight: 700;
        color: #111111;
        text-align: center;
        line-height: 1.6;
      }

      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(6px); }
        to   { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="container">
        <div id="status-message" class="status-message">Waiting for Phone...</div>

        <div id="grid-content" class="grid-wrapper" style="display: none;">
          <!-- Left: Lat / Long -->
          <div class="col col-left">
            <div class="cell">
              <div class="label">Latitude</div>
              <div id="lat-val" class="value">--</div>
            </div>
            <div class="cell">
              <div class="label">Longitude</div>
              <div id="lon-val" class="value">--</div>
            </div>
          </div>

          <!-- Right: Time / Date -->
          <div class="col col-right">
            <div class="cell">
              <div class="label">Time</div>
              <div id="time-val" class="value">--</div>
            </div>
            <div class="cell">
              <div class="label">Date</div>
              <div id="date-val" class="value">--</div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- OBS OVERLAY REALTIME LISTENER MODULE -->
    <script type="module" src="./overlay.js"></script>
  </body>
</html>

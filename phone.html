<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>GGU Phone Transmitter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
        font-family: 'Figtree', sans-serif;
        background-color: #0f172a;
        color: #f8fafc;
        padding: 20px;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
      }
      .card {
        background-color: #1e293b;
        border-radius: 16px;
        padding: 24px;
        max-width: 440px;
        margin: 0 auto;
        width: 100%;
        box-shadow: 0 10px 25px rgba(0,0,0,0.3);
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
      }
      .title {
        font-size: 24px;
        font-weight: 800;
        background: linear-gradient(135deg, #0F4CFF, #D40000);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
      }
      .status {
        font-size: 13px;
        font-weight: 700;
        padding: 6px 12px;
        border-radius: 20px;
        display: inline-block;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .status.active { background: #059669; color: #fff; }
      .status.pending { background: #d97706; color: #fff; }
      .status.stopped { background: #475569; color: #fff; }
      .status.error { background: #dc2626; color: #fff; }

      .row {
        margin-bottom: 16px;
      }
      .label {
        font-size: 12px;
        color: #94a3b8;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin-bottom: 4px;
      }
      .value {
        font-size: 18px;
        font-weight: 600;
        color: #f8fafc;
        word-break: break-word;
      }

      /* Control Buttons */
      .btn-group {
        display: flex;
        gap: 12px;
        margin-top: 24px;
      }
      .btn {
        flex: 1;
        padding: 14px;
        border: none;
        border-radius: 12px;
        font-family: 'Figtree', sans-serif;
        font-size: 15px;
        font-weight: 800;
        cursor: pointer;
        transition: transform 0.1s ease, opacity 0.2s ease;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .btn:active {
        transform: scale(0.97);
      }
      .btn-start {
        background: linear-gradient(135deg, #059669, #10b981);
        color: #ffffff;
      }
      .btn-stop {
        background: linear-gradient(135deg, #dc2626, #ef4444);
        color: #ffffff;
      }
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="header">
        <h1 class="title">GGU Transmitter</h1>
        <span id="accuracy" style="font-size: 12px; color: #38bdf8; font-weight: 700;">--</span>
      </div>

      <div id="status" class="status stopped">Stopped</div>

      <div class="row">
        <div class="label">Latitude</div>
        <div id="lat" class="value">--</div>
      </div>

      <div class="row">
        <div class="label">Longitude</div>
        <div id="lon" class="value">--</div>
      </div>

      <div class="row">
        <div class="label">Place</div>
        <div id="address" class="value">--</div>
      </div>

      <!-- Start & Stop Control Buttons -->
      <div class="btn-group">
        <button id="btn-start" class="btn btn-start">Start Stream</button>
        <button id="btn-stop" class="btn btn-stop" disabled>Stop Stream</button>
      </div>
    </div>

    <script type="module" src="./phone.js"></script>
  </body>
</html>
